  <style>
    :root {
      --bg: #fcfafa;
      --text: #171a21;
      --muted: #5f6573;
      --olive: #4b4b31;
      --title: #b66238;
      --line: rgba(23, 26, 33, .14);
      --script: "Beth Ellen", cursive;
      --sc: "Cormorant SC", Georgia, serif;
      --serif: "Lora", Georgia, serif;
      --sans: "Inter", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 var(--serif);
      text-align: center;
    }

    .card {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(36px, 8vh, 88px) 16px clamp(20px, 4vh, 40px);
    }

    .mark {
      display: block;
      width: clamp(46px, 7vw, 64px);
      aspect-ratio: 166 / 160;
      background: var(--title);
      -webkit-mask: url("assets/logo-mark.png") center / contain no-repeat;
      mask: url("assets/logo-mark.png") center / contain no-repeat;
    }

    .std {
      margin: clamp(10px, 2vh, 18px) 0 0;
      font: 400 clamp(40px, 9vw, 72px)/1.25 var(--script);
      color: var(--title);
    }

    h1 {
      margin: clamp(14px, 2.4vh, 22px) 0 0;
      padding-left: .14em;           /* balances the trailing letter-spacing */
      font: 700 clamp(30px, 6.4vw, 56px)/1.05 var(--sc);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--olive);
    }
    h1 .amp { letter-spacing: 0; padding: 0 .18em; }

    .when {
      margin: clamp(14px, 2.4vh, 22px) 0 0;
      font: 700 clamp(21px, 3.6vw, 28px)/1.3 var(--sc);
      letter-spacing: .06em;
      color: var(--olive);
    }
    .where {
      margin: 2px 0 0;
      font: 700 clamp(17px, 2.6vw, 20px)/1.4 var(--sc);
      letter-spacing: .06em;
      color: var(--muted);
    }

    .note {
      margin: clamp(18px, 3vh, 28px) 0 0;
      font-style: italic;
      color: var(--muted);
    }

    .cal {
      margin-top: clamp(18px, 3vh, 26px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font: 500 15px/1 var(--sans);
    }
    .cal span { width: 100%; color: var(--muted); font-size: 14px; margin-bottom: 2px; }
    .cal a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      transition: background-color .2s, border-color .2s;
    }
    .cal a:hover { background: rgba(182, 98, 56, .08); border-color: rgba(182, 98, 56, .45); }
    .cal a:focus-visible { outline: 2px solid #2f5fb5; outline-offset: 3px; }
    .cal svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .village {
      flex: 0 0 auto;
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 0 16px;
    }
    .village img { display: block; width: 100%; height: auto; }

    @media (prefers-reduced-motion: no-preference) {
      .card > * { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
      .card > :nth-child(2) { animation-delay: .08s; }
      .card > :nth-child(3) { animation-delay: .16s; }
      .card > :nth-child(4) { animation-delay: .24s; }
      .card > :nth-child(5) { animation-delay: .3s; }
      .card > :nth-child(6) { animation-delay: .36s; }
      .card > :nth-child(7) { animation-delay: .42s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    }
  </style>
</head>

      </a>

      </a>
    </div>
  </main>

  <div class="village">

  </div>
