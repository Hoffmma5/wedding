<!doctype html>
<!-- The link-preview picture (1200 x 630) shown when the site is shared on
     WhatsApp, Messenger, email… Rendered to assets/og-image.jpg by
     tools/make_og.py; edit here and re-run. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@700&family=Lora:ital@1&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #fcfafa;
      color: #4b4b31;
      font-family: "Cormorant SC", Georgia, serif;
      text-align: center;
      position: relative;
    }
    .mark {
      display: block;
      width: 58px;
      aspect-ratio: 166 / 160;
      margin: 34px auto 0;
      background: #4b4b31;
      -webkit-mask: url("../assets/logo-mark.png") center / contain no-repeat;
      mask: url("../assets/logo-mark.png") center / contain no-repeat;
    }
    h1 { margin: 12px 0 0; padding-left: .14em; font-size: 54px; font-weight: 700; letter-spacing: .14em; line-height: 1; text-transform: uppercase; }
    p { margin: 12px 0 0; font-size: 25px; letter-spacing: .08em; }
    img { position: absolute; left: 50%; bottom: 0; width: 1060px; transform: translateX(-50%); }
  </style>
</head>
<body>
  <span class="mark"></span>
  <h1>Marek &amp; Paulo</h1>
  <p>1 – 3 October 2027 · Tavira, Algarve</p>
  <img src="../assets/village-day.webp" alt="">
</body>
</html>
